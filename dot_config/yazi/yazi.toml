"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true
linemode = "mtime"
show_hidden = false
show_symlink = true
scrolloff = 6

[preview]
wrap = "yes"
tab_size = 2
max_width = 1200
max_height = 1800
image_delay = 80
image_filter = "triangle"
image_quality = 75
